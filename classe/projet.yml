            - {lieu: L’Amazonie, texte: 'la forêt amazonienne, le colibri', x: 36.7, y: 53.8}
            - {lieu: Les Andes, texte: 'la flûte de pan, le lama', x: 33.3, y: 57.4}
            - {lieu: Panama, texte: les molas, x: 31.2, y: 47.8}
            - {lieu: Mexique, texte: 'Frida Kahlo ; le cacao', x: 28.4, y: 42.4}
