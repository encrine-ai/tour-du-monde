  oceanie-poles:
    resume: >-
      Plume rentre en Europe au printemps : la classe continue seule vers
      l’Océanie et les pôles, et lui raconte tout par lettre. La glace et les
      pôles, le kangourou, le récif de corail, et l’exposition « Notre tour du
      monde ».
    fil_rouge:
      nom: Des lettres pour Plume
      texte: >-
        Plume rentre en Europe au printemps : la classe continue seule vers
        l’Océanie et les pôles, et lui raconte tout par lettre.
    albums:
      - titre: Tiddalik, la grenouille qui avait bu toute l’eau
        auteur: légende aborigène d’Australie
        etude: true
      - titre: Perdu ? Retrouvé !
        auteur: Oliver Jeffers, traduit par Élisabeth Duval, Kaléidoscope
        note: un petit garçon traverse la mer en barque pour ramener un manchot chez lui
      - titre: Le réseau « le voyage et l’amitié »
      - titre: les lettres de la classe correspondante
    documentaires:
      - la glace et les pôles
      - le kangourou
      - le récif de corail
    textes:
      - '*Kookaburra* (chant traditionnel australien, en canon)'
      - une comptine en anglais
      - les chants de l’exposition
    oeuvres:
      - titre: peinture à points
        auteur: les peintres aborigènes du désert australien
      - titre: Polynésie, la mer
        auteur: Henri Matisse
        note: papiers découpés, blanc sur bleu
      - titre: La Mer de glace
        auteur: Caspar David Friedrich
    musique:
      - titre: « L’Hiver » (*Les Quatre Saisons*)
        auteur: Antonio Vivaldi
        note: œuvre patrimoniale 5
      - chants des baleines ; le didgeridoo ; paysage sonore de la banquise
    sorties:
      - expériences sur la glace (bac à glace, banquise miniature)
      - cycle piscine
      - liaison GS-CP
    spectacle:
      - exposition « Notre tour du monde » et chorégraphie de fin d’année pour les familles
    embleme: {imagier: koala}
    theme:
      atlas:
        carte: {x: 88, y: 66, cote: gauche}
        planche:
          centre: {x: 84, y: 70}
          zoom: 2
          route_texte: Plume est rentrée en Europe ; la classe lui écrit.
          reperes:
            - {lieu: Australie, texte: 'Tiddalik ; la peinture à points', x: 86.9, y: 66.4}
            - {lieu: Le récif de corail, texte: 'le poisson-clown, la tortue de mer', x: 90.7, y: 63.6}
            - {lieu: La côte est, texte: 'le kangourou, le koala, *Kookaburra*', x: 89.6, y: 72.1}
            - {lieu: Les terres australes, texte: 'vers le pôle Sud : la banquise, le manchot', x: 78.2, y: 75.8}

