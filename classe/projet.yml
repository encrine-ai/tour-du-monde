  ameriques:
    resume: >-
      Plume traverse l’Atlantique sur le mât d’un voilier et arrive au Brésil.
      Le maïs et le potager, le colibri, la forêt amazonienne, et le défilé du
      carnaval.
    fil_rouge:
      nom: Plume au Brésil
      texte: Plume traverse l’Atlantique sur le mât d’un voilier et arrive au Brésil.
    albums:
      - titre: La Légende des trois sœurs
        auteur: légende haudenosaunee, peuples iroquoiens
        etude: true
      - titre: La Légende du colibri
        auteur: conte amérindien, popularisé par Pierre Rabhi
      - titre: Le réseau « s’entraider, faire sa part »
        note: et des écrits fonctionnels — la recette, le documentaire
    documentaires:
      - le maïs et le potager
      - le colibri
      - les oiseaux d’Amérique
      - la forêt amazonienne
    textes:
      - une comptine pour compter en espagnol
      - les chants du carnaval
      - la comptine du colibri
    oeuvres:
      - titre: autoportraits
        auteur: Frida Kahlo
        note: le portrait
      - titre: molas du Panama
        note: pavages
      - titre: masques du carnaval
    musique:
      - titre: Symphonie du Nouveau Monde (largo)
        auteur: Antonín Dvořák
        note: œuvre patrimoniale 3 — le cor anglais, une mélodie lente
      - la flûte de pan des Andes ; la batucada
    sorties:
      - semis du potager des trois sœurs (maïs, haricots, courges)
      - atelier du chocolat chaud
      - chasse au trésor au parc
      - un spectacle vu au théâtre
    spectacle:
      - défilé du carnaval masqué dans l’école
