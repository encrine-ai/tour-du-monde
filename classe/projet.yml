# Le projet « Le tour du monde », en données : ce que l'accueil et la page
# de chaque période montrent (skill charte-graphique, « La page de
# période » ; `classe.py verifier` en contrôle la forme). Il reprend les
# éléments de 01-projet-annuel.md, qui fait foi — il ne le remplace pas.
#
# `theme.atlas` : les données propres au thème « atlas » — la position du
# continent sur la mappemonde (en % de l'image, `cote` : où se pose son
# cartouche) et, pour une planche gravée, sa carte, ses repères numérotés et
# la route de Plume.

annee:
  mascotte:
    cle: plume
    nom: Plume, la cigogne voyageuse
    texte: >-
      La mascotte de la classe. Une cigogne blanche quitte l’Europe à la fin
      de l’été pour passer l’hiver en Afrique : c’est elle qui emmène la
      classe, envoie une carte postale de chaque continent et introduit les
      situations-problèmes.
    embleme: projet/cigogne-gravure.jpg
  fils_rouges:
    - cle: passeport
      nom: Le passeport du petit voyageur
      texte: >-
        Un carnet individuel, tamponné à chaque continent : dessins
        d’observation légendés, photographies, traces des expériences. Il
        montre les progrès et circule à la maison à chaque fin de période.
    - cle: carte
      nom: La grande carte du monde
      texte: >-
        Un planisphère affiché dans la classe, où l’on pique à chaque période
        les animaux, les plantes et les étapes du voyage de Plume.
    - cle: valise
      nom: La valise de la période
      texte: >-
        Une vraie valise arrive à chaque continent avec des objets-mystères :
        un instrument, une étoffe, un fruit, une carte postale. Elle lance le
        corpus et les questions des enfants.
    - cle: langues
      nom: Bonjour dans toutes les langues
      texte: >-
        Saluer, compter jusqu’à cinq et chanter une comptine dans une langue
        du continent ; les langues des familles de la classe sont invitées en
        premier.
    - cle: elevages
      nom: Élevages et plantations
      texte: >-
        Abri à hérisson et mangeoire, semis de mil ou de sorgho, riz en
        barquette et phasmes, maïs, haricots et courges, bac à glace et
        banquise miniature : un par continent.

periodes:
  europe:
    resume: >-
      On part de ce que les enfants voient chaque jour : l’Europe, c’est ici,
      dans la cour et dans le parc voisin. Les repères de la carte disent où
      vivent les animaux, les contes et les œuvres de la période.
    fil_rouge:
      nom: Lettre de Plume
      message: >-
        « Chers enfants, l’été se termine et je prépare mon grand voyage. Je
        quitte l’Europe pour passer l’hiver en Afrique : venez avec moi ! »
      texte: >-
        Une cigogne blanche quitte l’Europe à la fin de l’été pour passer
        l’hiver en Afrique : c’est elle qui emmène la classe. Son départ, à la
        fin de la période 1, ouvre la période 2.
      embleme: projet/cigogne-gravure.jpg
    albums:
      - titre: Boucle d’or et les trois ours
        auteur: conte traditionnel anglais
        etude: true
        image: projet/trois-ours.jpg
      - titre: Le Petit Chaperon rouge
        auteur: Perrault, Grimm
        image: projet/fokke-chaperon.jpg
      - titre: Les Trois Petits Cochons
        auteur: conte traditionnel anglais
      - titre: Le réseau « l’ours et le loup des contes »
        note: la version lue est au choix de l’enseignant
    documentaires:
      - la carte du monde et l’Europe
      - la cigogne et sa migration
      - titre: le hérisson
        image: projet/tempesta-herisson.jpg
      - les arbres d’automne
    textes:
      - comptines de rentrée
      - '*Frère Jacques* chanté en français, en anglais, en allemand et en espagnol'
      - '*Promenons-nous dans les bois* (traditionnel)'
      - une comptine pour compter jusqu’à dix
    oeuvres:
      - titre: Les Coquelicots
        auteur: Claude Monet
        note: un paysage
        image: projet/monet-coquelicots.jpg
      - titre: L’Arbre de vie
        auteur: Gustav Klimt
        note: spirales et motifs
        image: projet/klimt-arbre-de-vie.jpg
      - titre: Joan Miró
        note: signes, lignes et couleurs pures
      - titre: Dessin d’observation
        note: les feuilles et les fruits d’automne
    musique:
      - titre: « Dans l’antre du roi de la montagne »
        auteur: Edvard Grieg, *Peer Gynt*
        note: œuvre patrimoniale 1 — un tempo qui accélère, des nuances qui enflent
      - rondes et jeux dansés traditionnels d’Europe
    sorties:
      - sortie au parc ou au bois le plus proche (chêne, châtaignier, traces du hérisson, oiseaux)
      - Semaine du goût « le petit-déjeuner d’Europe »
      - installation de l’abri à hérisson et de la mangeoire
    spectacle:
      - 'théâtre de marionnettes « Boucle d’or et les trois ours » (trois voix : la grosse, la moyenne, la petite)'
    embleme: {imagier: herisson}
    theme:
      atlas:
        carte: {x: 64, y: 24, cote: gauche}
        planche:
          image: images/carte-europe-maaskamp.jpg
          route: M44 57 C 38 66, 31 80, 24 99
          route_texte: En pointillé, la route de Plume vers l’Afrique, par le détroit de Gibraltar.
          reperes:
            - {lieu: Islande, texte: le macareux, x: 19, y: 15}
            - {lieu: Laponie, texte: le renne, x: 57, y: 15}
            - {lieu: Norvège, texte: 'Grieg, « Dans l’antre du roi de la montagne »', x: 44, y: 31}
            - {lieu: Angleterre, texte: 'Boucle d’or et Les Trois Petits Cochons, contes anglais', x: 31, y: 45}
            - {lieu: Allemagne, texte: Le Petit Chaperon rouge des frères Grimm, x: 45, y: 56}
            - {lieu: France, texte: 'Monet, Les Coquelicots ; Perrault', x: 31, y: 61}
            - {lieu: Vienne, texte: 'Klimt, L’Arbre de vie', x: 52, y: 64}
            - {lieu: Les Alpes, texte: 'le bouquetin, l’edelweiss', x: 38.5, y: 67}
            - {lieu: Provence, texte: la lavande, x: 33.5, y: 74}
            - {lieu: Grèce, texte: l’olivier, x: 65, y: 86}

  afrique:
    resume: >-
      Plume arrive au Sahel, où les cigognes d’Europe passent l’hiver. La
      classe découvre la savane, le désert et l’oasis, le baobab, et le marché
      de Handa.
    fil_rouge:
      nom: Plume au Sahel
      texte: >-
        Plume arrive au Sahel, où les cigognes d’Europe passent l’hiver ; elle
        envoie sa carte postale d’Afrique.
    albums:
      - titre: La Surprise de Handa
        auteur: Eileen Browne
        etude: true
      - titre: Rafara
        auteur: conte populaire malgache, version d’Anne-Catherine De Boel
      - titre: un conte du lièvre rusé
        auteur: raconté d’après *La Belle Histoire de Leuk-le-Lièvre* (Léopold Sédar Senghor et Abdoulaye Sadji)
      - titre: Le réseau « le petit qui trompe le plus fort »
    documentaires:
      - les animaux de la savane
      - le baobab
      - le voyage de la cigogne jusqu’au Sahel
      - le désert et l’oasis
    textes:
      - '*Funga Alafia* (chant d’accueil traditionnel d’Afrique de l’Ouest)'
      - '*Kye Kye Kule* (chant à répondre traditionnel du Ghana)'
      - compter jusqu’à cinq en swahili
      - comptines des animaux
    oeuvres:
      - titre: tissus wax et bogolan du Mali
        note: motifs
      - titre: peintures murales ndébélé
        auteur: Esther Mahlangu (Afrique du Sud)
      - titre: peinture à la terre et à l’ocre
    musique:
      - titre: Le Carnaval des animaux
        auteur: Camille Saint-Saëns
        note: "œuvre patrimoniale 2 — « Marche royale du lion », « L’Éléphant » : les timbres graves"
      - le djembé, appels et réponses ; *Kye Kye Kule*
    sorties:
      - visite d’un parc zoologique (la savane africaine)
      - un conteur invité
      - semis de sorgho en classe
      - le marché de Handa (jeu d’achat et de vente)
    spectacle:
      - '*La Surprise de Handa* mimée et chantée pour la fête de fin d’année, avec les tambours de la classe'
    embleme: {imagier: girafe}
    theme:
      atlas:
        carte: {x: 65, y: 51, cote: droite}
        planche:
          centre: {x: 60, y: 52}
          zoom: 2.4
          route: M53 30 C 55 36, 58 41, 62 44.4
          route_texte: En pointillé, la route de Plume jusqu’au Sahel.
          reperes:
            - {lieu: Le Sahel, texte: Plume passe l’hiver avec les cigognes d’Europe, x: 62, y: 44.4}
            - {lieu: Sénégal, texte: Leuk-le-Lièvre, le conte de Senghor, x: 52.4, y: 42}
            - {lieu: Mali, texte: les tissus bogolan, x: 56, y: 42.6}
            - {lieu: Ghana, texte: '*Kye Kye Kule*, le chant à répondre', x: 55.4, y: 47.5}
            - {lieu: Égypte, texte: 'le désert, l’oasis et le papyrus', x: 64.6, y: 40.3}
            - {lieu: Kenya, texte: La Surprise de Handa, x: 67.6, y: 52.5}
            - {lieu: La savane, texte: 'le lion, la girafe, le zèbre', x: 64.6, y: 55.5}
            - {lieu: Madagascar, texte: Rafara, le conte malgache, x: 68.2, y: 58.4}
            - {lieu: Afrique du Sud, texte: 'Esther Mahlangu, les peintures ndébélé', x: 64.4, y: 64}

  asie:
    resume: >-
      Plume franchit l’Himalaya et arrive en Chine. Le riz et la rizière, le
      panda, le phasme et le ver à soie, et le Nouvel An lunaire, juste avant
      les vacances.
    fil_rouge:
      nom: Plume en Chine
      texte: Plume franchit l’Himalaya et arrive en Chine, à temps pour le Nouvel An lunaire.
    albums:
      - titre: La Grande Course des animaux
        auteur: légende chinoise du zodiaque
        etude: true
      - titre: Le Lièvre de la Lune
        auteur: conte traditionnel de l’Inde et du Japon
      - titre: Issun-bōshi
        auteur: conte traditionnel japonais
      - titre: Le réseau « le petit qui réussit »
    documentaires:
      - le panda
      - le riz et la rizière
      - le phasme et le ver à soie
      - le Nouvel An lunaire
    textes:
      - '*Sakura* (chant traditionnel japonais)'
      - la comptine des douze animaux
      - compter jusqu’à cinq en japonais et en chinois
    oeuvres:
      - titre: La Grande Vague de Kanagawa
        auteur: Hokusai
        note: estampe
      - titre: calligraphie au pinceau et à l’encre
      - titre: origami
    musique:
      - titre: « Pagodes » (*Estampes*)
        auteur: Claude Debussy
        note: œuvre patrimoniale 4 — le piano qui imite les gongs
      - paysage sonore du temple (gong, clochettes, flûte de bambou)
    sorties:
      - élevage de phasmes et riz en barquette
      - atelier d’origami et de calligraphie
      - fabrication des cerfs-volants
      - fête du Nouvel An lunaire (l’année de la chèvre commence le 6 février 2027)
    spectacle:
      - théâtre d’ombres *La Grande Course des animaux* et numéros de cirque
    embleme: {imagier: panda-geant}
    theme:
      atlas:
        carte: {x: 79, y: 31, cote: dessus}
