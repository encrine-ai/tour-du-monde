          zoom: 2.3
          route: M64 41 C 68 36, 72 36, 76.8 38.7
          route_texte: En pointillé, la route de Plume par-dessus l’Himalaya.
          reperes:
            - {lieu: L’Himalaya, texte: 'Plume franchit les montagnes ; le yack', x: 76.8, y: 38.7}
            - {lieu: Chine, texte: 'le Nouvel An lunaire, la Grande Course des animaux, le panda', x: 80.8, y: 38.1}
            - {lieu: Japon, texte: 'Hokusai, Issun-bōshi, *Sakura*', x: 85.8, y: 33.6}
            - {lieu: Inde, texte: Le Lièvre de la Lune, x: 74.4, y: 45.7}
