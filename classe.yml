# La classe de démonstration — « Le tour du monde », un continent par période.
# La période 1 (l'Europe) est écrite, cahiers compris ; les suivantes arrivent
# une par une (skill nouvelle-classe). Après toute modification :
#   python3 scripts/classe.py generer && python3 scripts/classe.py verifier

nom: Classe de démonstration
niveau:
  code: GS
  libelle: Grande Section
annee: 2026-2027
projet: Le tour du monde
sous_titre: classe de démonstration
accroche: >-
  Un continent par période, de l’Europe aux pôles, avec Plume, la cigogne
  voyageuse. La période 1 est prête : progressions, évaluations, fiches,
  imagier et cartes de vocabulaire. Les autres continents arrivent période
  par période.
conformite: Conforme au programme officiel de l'école maternelle (cycle 1, 2024-2026) et au
  programme d'éducation à la vie affective et relationnelle.
theme: tour-du-monde
ton: tu
# Le dépôt GitHub de CETTE classe, « propriétaire/dépôt » : à définir par
# l'entretien (skill nouvelle-classe). S'il ne correspond pas au dépôt
# courant, c'est une copie faite par « Use this template » d'une classe
# partagée : l'entretien passe en mode « enrichir » et écrit `origine`
# (depot, titre, auteur, licence, site, reprise_le), que le pied du site
# crédite.
depot: encrine-ai/tour-du-monde
moteur:
  depot: encrine-ai/moteur
  version: fc4afc3
galerie:
  depot: encrine-ai/encrine-ai.github.io
partage:
  # les personnages des problèmes de mathématiques (« Nils a 3 valises »)
  prenoms_fictifs: [Nils, Ana, Malik, Elsa]
  textes_autorises: []
  licence: CC BY-SA 4.0
  auteur: Encrine
contenu:
  referentiel: referentiel/cycle1-gs.yml
  annotations: classe/annotations.yml
  imagier: classe/imagier.py
  corpus: classe/corpus.py
# La zone de vacances de la classe : ses dates viennent du calendrier officiel
# de l'année, dans le moteur (referentiel/calendrier-<annee>.yml).
calendrier:
  zone: C
